name: Windows PowerShell 5.1 acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan suites
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate suite manifest
        id: plan
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\Invoke-HelloApprovalCI.ps1 -Plan
          exit $LASTEXITCODE

  suite:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run suite
        shell: powershell
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\Invoke-HelloApprovalCI.ps1 -Suite $env:SUITE
          exit $LASTEXITCODE

  required-ci:
    # Stable branch-protection check: requires both manifest planning and every matrix suite.
    name: Required CI
    if: ${{ always() }}
    needs: [plan, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify full Windows PowerShell 5.1 acceptance
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        shell: bash
        run: |
          printf 'Plan suites: %s\nMatrix suites: %s\n' "$PLAN_RESULT" "$SUITE_RESULT"
          if [[ "$PLAN_RESULT" != success || "$SUITE_RESULT" != success ]]; then
            echo '::error::Windows PowerShell 5.1 acceptance is not fully successful.'
            exit 1
          fi
